[project]
name = "agentprobe"
version = "0.1.0"
description = "Runtime authorization test harness for AI agents"
authors = [
    { name = "Sarosh Quraishi" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
garak = [
    "garak>=0.17",  # integrations.garak (tested on 0.17.x); bridge tests skip without it
]

[project.scripts]
agentprobe = "agentprobe.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
